<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    select { display: block; padding: .4rem; margin: .5rem 0 1rem; font: inherit; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <p>Помощник предлагает тему и ответ. Проверьте результат перед отправкой клиенту.</p>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <label for="topic">Тема заявки</label>
    <select id="topic">
      <option value="">Выберите тему вручную</option>
      <option value="delivery">Доставка</option>
      <option value="pricing">Цены</option>
      <option value="other">Другое</option>
    </select>
    <label for="draft">Черновик ответа — можно отредактировать</label>
    <textarea id="draft" rows="5"></textarea>
    <p>Страница ничего не отправляет клиенту автоматически.</p>
  </section>
  <script type="module">
    import { createTriageController } from "./triage-client.mjs";
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const result = document.querySelector("#result");
    const status = document.querySelector("#status");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const messages = {
      idle: "",
      loading: "Разбираем заявку…",
      invalid_input: "Введите текст заявки — одних пробелов недостаточно.",
      ready: "Черновик готов. Проверьте тему и текст ответа.",
      manual_review: "Помощник не смог разобрать заявку. Выберите тему и напишите ответ вручную. Исходный текст остался в поле «Текст заявки».",
    };
    const controller = createTriageController({ render(state) {
      status.textContent = messages[state.status];
      message.setAttribute("aria-invalid", String(state.status === "invalid_input"));
      form.setAttribute("aria-busy", String(state.status === "loading"));
      topic.value = state.topic ?? "";
      draft.value = state.draft ?? "";
      result.hidden = !["ready", "manual_review"].includes(state.status);
    } });
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      void controller.submit(message.value);
    });
    message.addEventListener("input", controller.reset);
  </script>
</body>
</html>
